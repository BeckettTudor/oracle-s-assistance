<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Oracle's Assistance</title>
  <link rel="icon" href="data:,">
  <style>
    @font-face {
      font-family: 'Cinzel';
      src: url('assets/fonts/Cinzel.ttf') format('truetype');
      font-weight: 400 900;
    }
    @font-face {
      font-family: 'Pixelify Sans';
      src: url('assets/fonts/PixelifySans.ttf') format('truetype');
      font-weight: 400 700;
    }
    /* Keycap labels: Jersey 10's capitals read like printed keys. */
    @font-face {
      font-family: 'Jersey 10';
      src: url('assets/fonts/Jersey10-Regular.ttf') format('truetype');
    }
    /* The game's text font: Pixelify Sans letters with Jersey 10 numerals,
       whose digits are much easier to read at small sizes. Faces of one
       family are matched last-declared first, so the digit face comes last. */
    @font-face {
      font-family: 'GameUI';
      src: url('assets/fonts/PixelifySans.ttf') format('truetype');
      font-weight: 400 700;
    }
    @font-face {
      font-family: 'GameUI';
      src: url('assets/fonts/Jersey10-Regular.ttf') format('truetype');
      unicode-range: U+0030-0039, U+0025;
      font-weight: 400 700;
      size-adjust: 122%;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d0906;
      overflow: hidden;
    }
    /* The canvas always fills the browser window; the game adapts to it. */
    #game {
      position: fixed;
      inset: 0;
    }
    #game canvas {
      display: block;
      width: 100vw !important;
      height: 100vh !important;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f2c14e;
      font: 24px 'Pixelify Sans', monospace;
      letter-spacing: 2px;
    }
    #boot-error {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px;
      background: #0e1438;
      color: #fff3d6;
      font: 18px 'Pixelify Sans', monospace;
      text-align: center;
    }
    #boot-error b { color: #f2c14e; font-size: 24px; }
    #boot-error code { color: #c9b48a; font-size: 14px; max-width: 760px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <div id="loading">Loading…</div>
  <div id="boot-error">
    <b>The game couldn't start.</b>
    <span>Usually the browser is mixing old and new copies of the game's files.<br>
      Press <b>Ctrl + Shift + R</b> to reload them, or start the game with <b>python serve.py</b>.</span>
    <code id="boot-error-detail"></code>
  </div>
  <div id="game"></div>
  <script>
    // Show startup failures on screen instead of leaving a blank page.
    // Once every scene has started cleanly (UIScene sets __gameRunning),
    // errors are left to the console so a glitch never covers a working game.
    window.__bootFailed = (msg) => {
      if (window.__gameRunning) return;
      document.getElementById('loading')?.remove();
      document.getElementById('boot-error').style.display = 'flex';
      document.getElementById('boot-error-detail').textContent = msg;
    };
    window.addEventListener('error', (e) => window.__bootFailed(e.message || 'A script failed to load.'));
    window.addEventListener('unhandledrejection', (e) => window.__bootFailed(String(e.reason?.message || e.reason)));
  </script>
  <script src="lib/phaser.min.js" onerror="__bootFailed('lib/phaser.min.js failed to load.')"></script>
  <script type="module" src="src/main.js" onerror="__bootFailed('src/main.js failed to load.')"></script>
</body>
</html>
